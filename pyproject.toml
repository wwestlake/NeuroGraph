[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurograph"
version = "0.1.0"
description = "LLM-free semantic graph builder: embedding-based clustering and co-occurrence graph construction for organizing text."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "William W. Westlake Jr." }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "sentence-transformers>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.urls]
Homepage = "https://github.com/wwestlake/NeuroGraph"
Issues = "https://github.com/wwestlake/NeuroGraph/issues"

[tool.setuptools.packages.find]
include = ["neurograph*"]
